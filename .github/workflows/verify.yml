name: Verify Signal

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          SIGNAL_TEST_NEO4J_URI: bolt://localhost:7687

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SAMPLE_DATA: '0'

  snyk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Snyk configuration
        id: snyk_config
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
        run: |
          if [[ -z "$SNYK_TOKEN" || -z "$SNYK_ORG" ]]; then
            printf '::warning::Snyk did not run. Configure the SNYK_TOKEN repository secret and SNYK_ORG variable.\n'
            printf 'Snyk did not run because the repository scanner credential or organization is missing.\n' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              exit 1
            fi
            exit 0
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        if: steps.snyk_config.outputs.configured == 'true'
        run: python -m pip install -r backend/requirements.txt

      - name: Snyk Open Source (backend)
        if: steps.snyk_config.outputs.configured == 'true'
        working-directory: backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
        run: npx --yes snyk@1.1309.0 test --file=requirements.txt --command=python --org="$SNYK_ORG"

      - name: Snyk Open Source (frontend)
        if: "!cancelled() && steps.snyk_config.outputs.configured == 'true'"
        working-directory: frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
        run: npx --yes snyk@1.1309.0 test --file=package-lock.json --org="$SNYK_ORG"

      - name: Snyk Code
        if: "!cancelled() && steps.snyk_config.outputs.configured == 'true'"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
        run: npx --yes snyk@1.1309.0 code test --org="$SNYK_ORG"
