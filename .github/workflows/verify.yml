name: Verify Signal

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          SIGNAL_TEST_NEO4J_URI: bolt://localhost:7687

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SAMPLE_DATA: '0'

  snyk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - name: Snyk SCA and SAST
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
        run: |
          if [[ -z "$SNYK_TOKEN" ]]; then
            printf '::warning::Set the SNYK_TOKEN repository secret to run Snyk SCA and SAST.\n'
            exit 0
          fi
          snyk_org=()
          if [[ -n "$SNYK_ORG" ]]; then
            snyk_org=("--org=$SNYK_ORG")
          fi
          snyk_result=0
          (cd backend && npx --yes snyk@1.1309.0 test --file=requirements.txt --command=python "${snyk_org[@]}") || snyk_result=1
          (cd frontend && npx --yes snyk@1.1309.0 test --file=package-lock.json "${snyk_org[@]}") || snyk_result=1
          npx --yes snyk@1.1309.0 code test "${snyk_org[@]}" || snyk_result=1
          exit "$snyk_result"
